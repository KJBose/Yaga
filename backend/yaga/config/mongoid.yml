development:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_URI', 'mongodb://localhost:27017/yaga') %>
      options:
        server_selection_timeout: 5
  options:
    preload_models: false

test:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_TEST_URI', 'mongodb://localhost:27017/yaga_test') %>
      options:
        server_selection_timeout: 5
  options:
    preload_models: false

production:
  clients:
    default:
      uri: <%= ENV.fetch('MONGODB_URI', ENV.fetch('MONGOLAB_URI', 'mongodb://localhost:27017/yaga')) %>
      options:
        server_selection_timeout: 5
        connect_timeout: 10
  options:
    preload_models: true
