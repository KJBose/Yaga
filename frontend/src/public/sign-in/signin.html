<div class="container auth-shell">
  <section class="auth-panel">
    <h2>Login</h2>
    <p class="auth-subtitle">Access your network, profile, support board, and messages.</p>

    <form name="signIn" novalidate ng-submit="signerIn.submit()">
      <div class="form-group">
        <input type="email" class="form-control" name="email" placeholder="Email"
               ng-model="signerIn.user.email" required>
      </div>

      <div class="form-group">
        <input type="password" class="form-control" name="password" placeholder="Password"
               ng-model="signerIn.user.password" required>
      </div>

      <button class="btn btn-primary auth-submit-btn" ng-disabled="signIn.$invalid || signerIn.processing" type="submit">
        {{ signerIn.processing ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="text-danger" ng-if="signerIn.error">{{ signerIn.error }}</p>
  </section>
</div>
