<div class="container auth-shell">
  <section class="auth-panel auth-panel-wide">
    <h2>Create Account</h2>
    <p class="auth-subtitle">Join the platform, personalize your profile, and start contributing.</p>

    <form name="signUp" novalidate ng-submit="signer.submit()">
      <div class="form-group">
        <input type="text" class="form-control" name="firstName" placeholder="First name"
               ng-model="signer.user.first_name" required>
      </div>

      <div class="form-group">
        <input type="text" class="form-control" name="lastName" placeholder="Last name"
               ng-model="signer.user.last_name" required>
      </div>

      <div class="form-group">
        <input type="email" class="form-control" name="email" placeholder="Email"
               ng-model="signer.user.email" required>
      </div>

      <div class="form-group">
        <input type="password" class="form-control" name="password" placeholder="Password (min 8 chars)"
               ng-model="signer.user.password" ng-minlength="8" required>
      </div>

      <div class="form-group">
        <input type="password" class="form-control" name="passwordConfirmation" placeholder="Confirm password"
               ng-model="signer.user.password_confirmation" ng-minlength="8" required>
      </div>

      <div class="form-group">
        <input type="text" class="form-control" name="phone" placeholder="Phone number"
               ng-model="signer.user.phone">
      </div>

      <div class="form-group">
        <select class="form-control" name="userType" ng-model="signer.user.user_type" required>
          <option ng-repeat="type in signer.userTypes" value="{{type}}">{{type}}</option>
        </select>
      </div>

      <div class="form-group">
        <input type="text" class="form-control" name="organizationName" placeholder="Organization (for NPO/GOV)"
               ng-model="signer.user.organization_name">
      </div>

      <div class="form-group">
        <textarea class="form-control" name="bio" placeholder="Bio"
                  ng-model="signer.user.bio" rows="3"></textarea>
      </div>

      <button class="btn btn-primary auth-submit-btn" ng-disabled="signUp.$invalid || signer.processing" type="submit">
        {{ signer.processing ? 'Creating account...' : 'Create account' }}
      </button>
    </form>

    <p class="text-success" ng-if="signer.success">{{ signer.success }}</p>
    <p class="text-danger" ng-if="signer.error">{{ signer.error }}</p>
  </section>
</div>
