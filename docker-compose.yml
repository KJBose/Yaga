services:
  mongodb:
    image: mongo:6
    container_name: yaga-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - yaga_mongo_data:/data/db

  backend:
    build:
      context: ./backend/yaga
      dockerfile: Dockerfile
    container_name: yaga-backend
    restart: "no"
    depends_on:
      - mongodb
    environment:
      RAILS_ENV: development
      MONGODB_URI: mongodb://mongodb:27017/yaga
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yaga-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  yaga_mongo_data:
